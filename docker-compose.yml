services:
  postgres:
    image: postgres:17-alpine
    container_name: time_organizer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-organizer_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super_secret_db_pass_2026}
      POSTGRES_DB: ${DB_NAME:-time_organizer}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-organizer_user} -d ${DB_NAME:-time_organizer}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
